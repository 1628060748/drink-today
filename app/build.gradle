plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.drinktoday'
    compileSdk 34

    defaultConfig {
        applicationId "com.drinktoday"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.1.2"
        vectorDrawables.useSupportLibrary = false
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

/**
 * 安装包产物固定命名：
 *   debug   -> drink-today-app.apk
 *   release -> drink-today-app-release.apk
 * 避免默认的 app-debug.apk 在多次构建、传输时难以区分。
 */
androidComponents {
    onVariants(selector().all()) { variant ->
        def suffix = variant.buildType == 'release' ? '-release' : ''
        variant.outputs.forEach { output ->
            output.outputFileName.set("drink-today-app${suffix}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
