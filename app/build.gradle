plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// 签名信息放在 rootProject 的 keystore.properties（不入库）；
// 缺少该文件时自动跳过签名，保证他人克隆后仍可 assembleDebug。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseKeystore = keystorePropsFile.exists()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.drinktoday'
    compileSdk 34

    defaultConfig {
        applicationId "com.drinktoday"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.2.0"
        vectorDrawables.useSupportLibrary = false
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // minSdk 26 不需要 v1（JAR）签名；开启 v2+v3 以支持未来的密钥轮换
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

/**
 * 安装包产物固定命名：
 *   debug   -> drink-today-app.apk
 *   release -> drink-today-app-release.apk
 * 避免默认的 app-debug.apk 在多次构建、传输时难以区分。
 */
androidComponents {
    onVariants(selector().all()) { variant ->
        def suffix = variant.buildType == 'release' ? '-release' : ''
        variant.outputs.forEach { output ->
            output.outputFileName.set("drink-today-app${suffix}.apk")
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
